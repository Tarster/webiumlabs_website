<!-- Footer Bar -->
<footer class="relative z-10 border-t border-white/5 bg-dark-600/80 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 py-12 flex flex-col md:flex-row items-center justify-between gap-6">
        <!-- Logo -->
        <a href="/" class="flex items-center">
            <img class="h-5 object-contain" src="https://framerusercontent.com/images/JuWcZDrNy5JqIlp4z2naCC0jbdw.svg" alt="Automatix Logo">
        </a>

        <!-- Navigation Links -->
        <nav class="flex flex-wrap items-center justify-center gap-x-8 gap-y-4">
            {% for link in footer_links_row1 %}
            <a href="{{ link.href }}" class="text-sm text-neutral-400 hover:text-white transition-colors duration-200">{{ link.label }}</a>
            {% endfor %}
            {% for link in footer_links_row2 %}
            <a href="{{ link.href }}" class="text-sm text-neutral-400 hover:text-white transition-colors duration-200">{{ link.label }}</a>
            {% endfor %}
        </nav>

        <!-- Copyright -->
        <p class="text-xs text-neutral-500">
            Copyright Automatix. All right reserved.
        </p>
    </div>
</footer>
