<!-- Footer Bar -->
<footer class="relative z-10 border-t border-white/5 bg-dark-600/80 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 py-12 flex flex-col md:flex-row items-center justify-between gap-6">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2 group">
            <svg class="h-5 w-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Stylized W Icon -->
                <path d="M4 6L10 18L13 11L16 18L22 6" stroke="url(#footer-logo-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="footer-logo-gradient" x1="4" y1="6" x2="22" y2="18" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#e46f03"/>
                        <stop offset="1" stop-color="#ffb168"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="text-lg font-bold font-satoshi tracking-tight text-white select-none">
                Webium<span class="text-orange-500">Labs</span>
            </span>
        </a>

        <!-- Navigation Links -->
        <nav class="flex flex-wrap items-center justify-center gap-x-8 gap-y-4">
            {% for link in footer_links_row1 %}
            <a href="{{ link.href }}" class="text-sm text-neutral-400 hover:text-white transition-colors duration-200">{{ link.label }}</a>
            {% endfor %}
            {% for link in footer_links_row2 %}
            <a href="{{ link.href }}" class="text-sm text-neutral-400 hover:text-white transition-colors duration-200">{{ link.label }}</a>
            {% endfor %}
        </nav>

        <!-- Copyright -->
        <p class="text-xs text-neutral-500">
            Copyright WebiumLabs. All right reserved.
        </p>
    </div>
</footer>
